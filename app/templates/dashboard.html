<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Manager Pro - Painel de BI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    
    <style>
        .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 20px; }
        .chart-card { border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: var(--bs-body-bg); position: relative; transition: box-shadow 0.3s; }
        .chart-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .actions-overlay { position: absolute; top: 15px; right: 15px; z-index: 10; display: flex; gap: 8px; }
        .btn-action { width: 32px; height: 32px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .select-scroll { max-height: 150px; overflow-y: auto; border: 1px solid var(--bs-border-color); border-radius: 5px; padding: 10px; background: var(--bs-tertiary-bg); }
        
        /* Ajustes de cores dinâmicas para o cabeçalho do Modal */
        [data-bs-theme="light"] .modal-header-custom { background-color: #f8f9fa; color: #212529; }
        [data-bs-theme="dark"] .modal-header-custom { background-color: #212529; color: #f8f9fa; }
        
        /* --- CORREÇÃO: Ajustes Finos do Select2 para Dark Mode --- */
        [data-bs-theme="dark"] .select2-container--bootstrap-5 .select2-selection {
            background-color: #2b3035;
            color: #dee2e6;
            border-color: #495057;
        }
        [data-bs-theme="dark"] .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice {
            background-color: #495057 !important; /* Cor de fundo das caixinhas selecionadas */
            color: #ffffff !important;            /* Cor do texto interno das caixinhas */
            border: 1px solid #6c757d !important;
        }
        [data-bs-theme="dark"] .select2-container--bootstrap-5 .select2-selection__choice__remove {
            color: #ff8080 !important; /* Cor do botão X de remover a tag */
        }
        [data-bs-theme="dark"] .select2-container--bootstrap-5 .select2-dropdown {
            background-color: #2b3035 !important;
            color: #dee2e6 !important;
        }
        [data-bs-theme="dark"] .select2-container--bootstrap-5 .select2-results__option--highlighted[aria-selected] {
            background-color: #0d6efd !important; /* Cor ao passar o mouse por cima na lista */
        }
    </style>
</head>
<body class="bg-body-tertiary">

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 px-3">
        <div>
            <h2 class="mb-0">⚙️ Painel Estratégico de BI Pro</h2>
            <p class="text-muted mb-0">Métricas analíticas segmentadas de ativos da rede local</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success px-4 fw-bold" onclick="abrirModalNovo()">+ Novo Gráfico</button>
            <button class="btn btn-outline-danger" onclick="resetarConfiguracoesAll()" title="Limpar cache antigo">🔄 Resetar Painel</button>
            <button class="btn btn-outline-secondary" id="btnTema">🌓 Theme</button>
            <a href="/" class="btn btn-outline-primary">Voltar à Lista</a>
        </div>
    </div>

    <div class="row g-3 mb-4 px-3">
        <div class="col-md-4"><div class="card p-3 text-center bg-primary text-white border-0 shadow-sm"><h6>Total Real</h6><h3>{{ total_real }}</h3></div></div>
        <div class="col-md-4"><div class="card p-3 text-center bg-success text-white border-0 shadow-sm"><h6>Online</h6><h3>{{ stats_status.up }}</h3></div></div>
        <div class="col-md-4"><div class="card p-3 text-center bg-danger text-white border-0 shadow-sm"><h6>Offline</h6><h3>{{ stats_status.down }}</h3></div></div>
    </div>

    <div id="dashboardGrid" class="grid-dashboard px-3"></div>
</div>

<div class="modal fade" id="modalBuilder" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow border-0">
            <div class="modal-header modal-header-custom border-bottom">
                <h5 class="modal-title fw-bold" id="modalTitulo">📊 Configurar Visão do Gráfico</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body py-4">
                <input type="hidden" id="cfgId">
                <div class="row g-4">
                    <div class="col-md-6 border-end">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Título do Gráfico</label>
                            <input type="text" id="cfgTitulo" class="form-control" placeholder="Ex: Equipamentos por Área">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Formato Visual</label>
                            <select id="cfgTipo" class="form-select">
                                <option value="bar">Barras Empilhadas (Melhor para Cruzamentos)</option>
                                <option value="doughnut">Rosca / Donut (Métrica Simples)</option>
                                <option value="pie">Pizza (Métrica Simples)</option>
                            </select>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label fw-bold text-primary">Métrica Base (Eixo X)</label>
                                <select id="cfgEixoX" class="form-select" onchange="atualizarOpcoesSelecao()">
                                    <option value="area">Área (Setor)</option>
                                    <option value="time">Time (Equipe)</option>
                                    <option value="tipo">Tipo de Ativo</option>
                                    <option value="vendor">Fabricante</option>
                                    <option value="status">Status (UP/DOWN)</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold text-success">Cruzar Com (Legenda)</label>
                                <select id="cfgCruzamento" class="form-select" onchange="atualizarOpcoesSelecao()">
                                    <option value="none">Nenhum (Visão Simples)</option>
                                    <option value="tipo">Tipo de Ativo</option>
                                    <option value="time">Time (Equipe)</option>
                                    <option value="area">Área (Setor)</option>
                                    <option value="status">Status (UP/DOWN)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-info">Filtros Avançados de Escopo</label>
                        <p class="small text-muted mb-2">Selecione para incluir (deixe vazio para carregar tudo):</p>
                        <div id="listaSelecao" class="select-scroll"></div>
                        <div class="form-check form-switch mt-3">
                            <input class="form-check-input" type="checkbox" id="cfgModoInverso">
                            <label class="form-check-label text-danger fw-bold" for="cfgModoInverso">Modo Ocultar selecionados (Blacklist)</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-light border-0">
                <button class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary px-5 fw-bold" onclick="salvarGrafico()">Fixar no Painel</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const dadosBrutos = {{ dispositivos_json | safe }};
    const STORAGE_KEY = 'bi_v6_hierarquico_config';
    let graficos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    const modalInst = new bootstrap.Modal(document.getElementById('modalBuilder'));

    if (graficos.length === 0) {
        graficos = [
            { id: 1, titulo: "Equipamentos por Setor e Tipo", eixoX: "area", cruzamento: "tipo", tipo: "bar", itens: [], modoInverso: false },
            { id: 2, titulo: "Distribuição de Hardware por Equipes", eixoX: "time", cruzamento: "tipo", tipo: "bar", itens: [], modoInverso: false }
        ];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(graficos));
    }

    function obterOpcoesUnicas() {
        const opcoes = new Set();
        const eixo = document.getElementById('cfgEixoX').value;
        const cruz = document.getElementById('cfgCruzamento').value;
        dadosBrutos.forEach(d => {
            [eixo, cruz].forEach(chave => {
                if (!chave || chave === 'none') return;
                opcoes.add((d[chave] || 'N/A').toUpperCase());
            });
        });
        return Array.from(opcoes).sort();
    }

    function atualizarOpcoesSelecao(anteriores = []) {
        const container = document.getElementById('listaSelecao');
        container.innerHTML = '';
        obterOpcoesUnicas().forEach(op => {
            const checked = anteriores.includes(op) ? 'checked' : '';
            container.innerHTML += `
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="${op}" id="chk-${op}" ${checked}>
                    <label class="form-check-label" for="chk-${op}">${op}</label>
                </div>`;
        });
    }

    function abrirModalNovo() {
        document.getElementById('cfgId').value = '';
        document.getElementById('cfgTitulo').value = '';
        document.getElementById('cfgEixoX').value = 'area';
        document.getElementById('cfgCruzamento').value = 'tipo';
        document.getElementById('cfgTipo').value = 'bar';
        document.getElementById('cfgModoInverso').checked = false;
        atualizarOpcoesSelecao();
        modalInst.show();
    }

    function editarGrafico(id) {
        const g = graficos.find(item => item.id === id);
        if (!g) return;
        document.getElementById('cfgId').value = g.id;
        document.getElementById('cfgTitulo').value = g.titulo;
        document.getElementById('cfgEixoX').value = g.eixoX;
        document.getElementById('cfgCruzamento').value = g.cruzamento;
        document.getElementById('cfgTipo').value = g.tipo;
        document.getElementById('cfgModoInverso').checked = g.modoInverso || false;
        atualizarOpcoesSelecao(g.itens || []);
        modalInst.show();
    }

    function salvarGrafico() {
        const id = document.getElementById('cfgId').value;
        const novoObj = {
            id: id ? parseInt(id) : Date.now(),
            titulo: document.getElementById('cfgTitulo').value || 'Nova Métrica',
            eixoX: document.getElementById('cfgEixoX').value,
            cruzamento: document.getElementById('cfgCruzamento').value,
            tipo: document.getElementById('cfgTipo').value,
            itens: Array.from(document.querySelectorAll('#listaSelecao input:checked')).map(cb => cb.value),
            modoInverso: document.getElementById('cfgModoInverso').checked
        };
        if (id) { graficos[graficos.findIndex(g => g.id === parseInt(id))] = novoObj; } 
        else { graficos.push(novoObj); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(graficos));
        modalInst.hide();
        renderizar();
    }

    function processarBI(config) {
        const info = { labels: new Set(), dataset: {} };
        const { eixoX, cruzamento, itens, modoInverso } = config;

        dadosBrutos.forEach(d => {
            const x = (d[eixoX] || 'N/A').toUpperCase();
            const c = cruzamento === 'none' ? 'TOTAL' : (d[cruzamento] || 'N/A').toUpperCase();

            if (itens.length > 0) {
                const estaNaLista = itens.includes(x) || itens.includes(c);
                if (modoInverso && estaNaLista) return;
                if (!modoInverso && !estaNaLista) return;
            }

            info.labels.add(x);
            if (!info.dataset[x]) info.dataset[x] = {};
            info.dataset[x][c] = (info.dataset[x][c] || 0) + 1;
        });
        return { labels: Array.from(info.labels).sort(), dataset: info.dataset };
    }

    const stringToColor = (s) => {
        if(s === 'UP' || s === 'ONLINE') return '#198754';
        if(s === 'DOWN' || s === 'OFFLINE') return '#dc3545';
        if(s === 'N/A') return '#6c757d';
        let h = 0; for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
        return `hsl(${Math.abs(h) % 360}, 70%, 45%)`;
    };

    function renderizar() {
        const grid = document.getElementById('dashboardGrid');
        grid.innerHTML = '';
        graficos.forEach(conf => {
            const card = document.createElement('div');
            card.className = 'card chart-card p-4 shadow-sm';
            card.innerHTML = `
                <div class="actions-overlay">
                    <button class="btn btn-sm btn-outline-primary btn-action bg-body" onclick="editarGrafico(${conf.id})">✎</button>
                    <button class="btn btn-sm btn-outline-danger btn-action bg-body" onclick="remover(${conf.id})">×</button>
                </div>
                <h6 class="fw-bold text-center mb-3 text-uppercase text-secondary">${conf.titulo}</h6>
                <div style="height: 320px;"><canvas id="c-${conf.id}"></canvas></div>`;
            grid.appendChild(card);

            const res = processarBI(conf);
            const series = new Set();
            res.labels.forEach(l => Object.keys(res.dataset[l]).forEach(s => series.add(s)));

            new Chart(document.getElementById(`c-${conf.id}`), {
                type: conf.tipo,
                data: {
                    labels: res.labels,
                    datasets: Array.from(series).map(s => ({
                        label: s, data: res.labels.map(l => res.dataset[l][s] || 0), backgroundColor: stringToColor(s)
                    }))
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    scales: conf.tipo === 'bar' ? { x: { stacked: true }, y: { stacked: true, ticks: { stepSize: 1 } } } : {}
                }
            });
        });
    }

    function remover(id) { 
        graficos = graficos.filter(g => g.id !== id); 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(graficos)); 
        renderizar(); 
    }

    function resetarConfiguracoesAll() {
        if(confirm("Deseja redefinir o painel para limpar os gráficos antigos do sistema?")) {
            localStorage.removeItem(STORAGE_KEY);
            window.location.reload();
        }
    }

    const htmlElement = document.documentElement;
    htmlElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');
    document.getElementById('btnTema').onclick = () => {
        const n = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-bs-theme', n);
        localStorage.setItem('theme', n);
    };

    renderizar();
</script>
</body>
</html>
