<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>BI Manager Pro - Mapeamento Hierárquico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 20px; }
        .chart-card { border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: var(--bs-body-bg); position: relative; }
        .actions-overlay { position: absolute; top: 15px; right: 15px; z-index: 10; display: flex; gap: 8px; }
        .btn-action { width: 32px; height: 32px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .select-scroll { max-height: 150px; overflow-y: auto; border: 1px solid #444; border-radius: 5px; padding: 10px; background: #222; }
    </style>
</head>
<body class="bg-body-tertiary">

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 px-3">
        <div>
            <h2 class="mb-0">⚙️ Painel de BI Pro</h2>
            <p class="text-muted mb-0">Métricas analíticas segmentadas de ativos da rede local</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success px-4 fw-bold" onclick="abrirModalNovo()">+ Novo Gráfico</button>
            <button class="btn btn-outline-secondary" id="btnTema">🌓</button>
            <a href="/" class="btn btn-outline-primary">Voltar</a>
        </div>
    </div>

    <div class="row g-3 mb-4 px-3">
        <div class="col-md-4"><div class="card p-3 text-center bg-primary text-white border-0"><h6>Total Real</h6><h3>{{ total_real }}</h3></div></div>
        <div class="col-md-4"><div class="card p-3 text-center bg-success text-white border-0"><h6>Online</h6><h3>{{ stats_status.up }}</h3></div></div>
        <div class="col-md-4"><div class="card p-3 text-center bg-danger text-white border-0"><h6>Offline</h6><h3>{{ stats_status.down }}</h3></div></div>
    </div>

    <div id="dashboardGrid" class="grid-dashboard px-3"></div>
</div>

<div class="modal fade" id="modalBuilder" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo">Configurar Painel</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="cfgId">
                <div class="row">
                    <div class="col-md-6 border-end">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Título</label>
                            <input type="text" id="cfgTitulo" class="form-control" placeholder="Ex: Equipamentos por Equipe">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Gráfico</label>
                            <select id="cfgTipo" class="form-select">
                                <option value="bar">Barras Empilhadas</option>
                                <option value="doughnut">Donut</option>
                                <option value="pie">Pizza</option>
                            </select>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label fw-bold">Eixo X</label>
                                <select id="cfgEixoX" class="form-select" onchange="atualizarOpcoesSelecao()">
                                    <option value="area">Área / Setor</option>
                                    <option value="time">Time / Equipe</option>
                                    <option value="tipo">Tipo de Ativo</option>
                                    <option value="vendor">Fabricante</option>
                                    <option value="status">Status</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">Cruzar com</label>
                                <select id="cfgCruzamento" class="form-select" onchange="atualizarOpcoesSelecao()">
                                    <option value="none">Nenhum (Simples)</option>
                                    <option value="tipo">Tipo de Ativo</option>
                                    <option value="time">Time / Equipe</option>
                                    <option value="area">Área / Setor</option>
                                    <option value="status">Status</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-info">Filtros Ativos</label>
                        <p class="small text-muted mb-2">Selecione para incluir (vazio exibe todos):</p>
                        <div id="listaSelecao" class="select-scroll"></div>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="cfgModoInverso">
                            <label class="form-check-label text-danger">Modo Ocultar selecionados (Blacklist)</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-100 fw-bold py-2" onclick="salvarGrafico()">Fixar Painel</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const dadosBrutos = {{ dispositivos_json | safe }};
    let graficos = JSON.parse(localStorage.getItem('bi_v5_config')) || [];
    const modalInst = new bootstrap.Modal(document.getElementById('modalBuilder'));

    function obterOpcoesUnicas() {
        const opcoes = new Set();
        const eixo = document.getElementById('cfgEixoX').value;
        const cruz = document.getElementById('cfgCruzamento').value;
        dadosBrutos.forEach(d => {
            [eixo, cruz].forEach(chave => {
                if (!chave || chave === 'none') return;
                opcoes.add((d[chave] || 'N/A').toUpperCase());
            });
        });
        return Array.from(opcoes).sort();
    }

    function atualizarOpcoesSelecao(anteriores = []) {
        const container = document.getElementById('listaSelecao');
        container.innerHTML = '';
        obterOpcoesUnicas().forEach(op => {
            const checked = anteriores.includes(op) ? 'checked' : '';
            container.innerHTML += `
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="${op}" id="chk-${op}" ${checked}>
                    <label class="form-check-label" for="chk-${op}">${op}</label>
                </div>`;
        });
    }

    function abrirModalNovo() {
        document.getElementById('cfgId').value = '';
        document.getElementById('cfgTitulo').value = '';
        document.getElementById('cfgModoInverso').checked = false;
        atualizarOpcoesSelecao();
        modalInst.show();
    }

    function editarGrafico(id) {
        const g = graficos.find(item => item.id === id);
        if (!g) return;
        document.getElementById('cfgId').value = g.id;
        document.getElementById('cfgTitulo').value = g.titulo;
        document.getElementById('cfgEixoX').value = g.eixoX;
        document.getElementById('cfgCruzamento').value = g.cruzamento;
        document.getElementById('cfgTipo').value = g.tipo;
        document.getElementById('cfgModoInverso').checked = g.modoInverso || false;
        atualizarOpcoesSelecao(g.itens || []);
        modalInst.show();
    }

    function salvarGrafico() {
        const id = document.getElementById('cfgId').value;
        const novoObj = {
            id: id ? parseInt(id) : Date.now(),
            titulo: document.getElementById('cfgTitulo').value || 'Métrica',
            eixoX: document.getElementById('cfgEixoX').value,
            cruzamento: document.getElementById('cfgCruzamento').value,
            tipo: document.getElementById('cfgTipo').value,
            itens: Array.from(document.querySelectorAll('#listaSelecao input:checked')).map(cb => cb.value),
            modoInverso: document.getElementById('cfgModoInverso').checked
        };
        if (id) { graficos[graficos.findIndex(g => g.id === parseInt(id))] = novoObj; } 
        else { graficos.push(novoObj); }
        localStorage.setItem('bi_v5_config', JSON.stringify(graficos));
        modalInst.hide();
        renderizar();
    }

    function processarBI(config) {
        const info = { labels: new Set(), dataset: {} };
        const { eixoX, cruzamento, itens, modoInverso } = config;

        dadosBrutos.forEach(d => {
            const x = (d[eixoX] || 'N/A').toUpperCase();
            const c = cruzamento === 'none' ? 'TOTAL' : (d[cruzamento] || 'N/A').toUpperCase();

            if (itens.length > 0) {
                const estaNaLista = itens.includes(x) || itens.includes(c);
                if (modoInverso && estaNaLista) return;
                if (!modoInverso && !estaNaLista) return;
            }

            info.labels.add(x);
            if (!info.dataset[x]) info.dataset[x] = {};
            info.dataset[x][c] = (info.dataset[x][c] || 0) + 1;
        });
        return { labels: Array.from(info.labels).sort(), dataset: info.dataset };
    }

    const stringToColor = (s) => {
        if(s === 'UP' || s === 'ONLINE') return '#198754';
        if(s === 'DOWN' || s === 'OFFLINE') return '#dc3545';
        let h = 0; for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
        return `hsl(${Math.abs(h) % 360}, 65%, 50%)`;
    };

    function renderizar() {
        const grid = document.getElementById('dashboardGrid');
        grid.innerHTML = '';
        graficos.forEach(conf => {
            const card = document.createElement('div');
            card.className = 'card chart-card p-4';
            card.innerHTML = `
                <div class="actions-overlay">
                    <button class="btn btn-sm btn-primary btn-action" onclick="editarGrafico(${conf.id})">✎</button>
                    <button class="btn btn-sm btn-danger btn-action" onclick="remover(${conf.id})">×</button>
                </div>
                <h6 class="fw-bold text-center mb-3 text-uppercase">${conf.titulo}</h6>
                <div style="height: 320px;"><canvas id="c-${conf.id}"></canvas></div>`;
            grid.appendChild(card);

            const res = processarBI(conf);
            const series = new Set();
            res.labels.forEach(l => Object.keys(res.dataset[l]).forEach(s => series.add(s)));

            new Chart(document.getElementById(`c-${conf.id}`), {
                type: conf.tipo,
                data: {
                    labels: res.labels,
                    datasets: Array.from(series).map(s => ({
                        label: s, data: res.labels.map(l => res.dataset[l][s] || 0), backgroundColor: stringToColor(s)
                    }))
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: conf.tipo === 'bar' ? { x: { stacked: true }, y: { stacked: true } } : {}
                }
            });
        });
    }

    function remover(id) { graficos = graficos.filter(g => g.id !== id); localStorage.setItem('bi_v5_config', JSON.stringify(graficos)); renderizar(); }
    document.getElementById('btnTema').onclick = () => {
        const n = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', n);
        localStorage.setItem('theme', n);
    };
    document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');
    renderizar();
</script>
</body>
</html>
